name: LidarScan
options:
  bundleIdPrefix: nl.eigen
  deploymentTarget:
    iOS: "17.0"
targets:
  LidarScan:
    type: application
    platform: iOS
    sources:
      - LidarScan
    scheme: {}
    info:
      path: LidarScan/Info.plist
      properties:
        CFBundleDevelopmentRegion: nl
        CFBundleDisplayName: LiDAR Scan
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        NSCameraUsageDescription: De camera en LiDAR-scanner worden gebruikt om te scannen en te meten.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - arkit
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.eigen.lidarscan
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_OPTIMIZATION_LEVEL: -O
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
